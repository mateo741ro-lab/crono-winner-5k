<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba GPS</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:30px;
}

h1{
    color:#ff6b35;
}

.box{
    background:#222;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

.numero{
    font-size:50px;
    font-weight:bold;
    margin:15px;
}

button{
    width:100%;
    padding:18px;
    border:0;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>CHRONO WINNER</h1>

<h2>PRUEBA GPS</h2>

<button onclick="iniciarGPS()">
INICIAR GPS
</button>

<div class="box">

<div>VELOCIDAD</div>

<div class="numero" id="velocidad">
--
</div>

<div>km/h</div>

<hr>

<div>PRECISIÓN</div>

<div id="precision">
--
</div>

<hr>

<div>LATITUD</div>

<div id="latitud">
--
</div>

<hr>

<div>LONGITUD</div>

<div id="longitud">
--
</div>

</div>


<script>

let anterior = null;

let velocidadFiltrada = 0;

function iniciarGPS(){

if(!navigator.geolocation){

alert("Este teléfono no tiene geolocalización disponible.");

return;

}

navigator.geolocation.watchPosition(

gps,

error,

{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
}

);

}


function gps(pos){

let lat = pos.coords.latitude;

let lon = pos.coords.longitude;

let precision = pos.coords.accuracy;

document.getElementById("precision").innerText =
Math.round(precision) + " metros";

document.getElementById("latitud").innerText =
lat.toFixed(6);

document.getElementById("longitud").innerText =
lon.toFixed(6);


/*
Si la precisión es demasiado mala,
no calculamos velocidad.
*/

if(precision > 30){

document.getElementById("velocidad").innerText =
"--";

anterior = null;

velocidadFiltrada = 0;

return;

}


/*
Primera medición.
*/

if(anterior === null){

anterior = {

lat:lat,

lon:lon,

tiempo:Date.now()

};

return;

}


let ahora = Date.now();

let segundos =
(ahora - anterior.tiempo) / 1000;


if(segundos <= 0){

return;

}


let metros =
distancia(
anterior.lat,
anterior.lon,
lat,
lon
);


/*
IGNORAR MOVIMIENTOS PEQUEÑOS.

Esto elimina gran parte del ruido GPS
cuando estás quieto.
*/

if(metros < 3){

velocidadFiltrada *= 0.5;

if(velocidadFiltrada < 0.2){

velocidadFiltrada = 0;

}

document.getElementById("velocidad").innerText =
velocidadFiltrada.toFixed(1);

anterior = {

lat:lat,

lon:lon,

tiempo:ahora

};

return;

}


/*
Velocidad calculada.
*/

let velocidad =
(metros / segundos) * 3.6;


/*
Ignorar velocidades imposibles.
*/

if(velocidad > 25){

anterior = {

lat:lat,

lon:lon,

tiempo:ahora

};

return;

}


/*
Filtro fuerte.

No permitimos cambios bruscos.
*/

velocidadFiltrada =
(velocidadFiltrada * 0.75) +
(velocidad * 0.25);


/*
Si estamos casi quietos,
forzamos a 0.
*/

if(velocidadFiltrada < 0.7){

velocidadFiltrada = 0;

}


document.getElementById("velocidad").innerText =
velocidadFiltrada.toFixed(1);


/*
Guardar posición.
*/

anterior = {

lat:lat,

lon:lon,

tiempo:ahora

};

}


/*
DISTANCIA GPS
*/

function distancia(lat1,lon1,lat2,lon2){

const R = 6371000;

const rad = Math.PI / 180;

const dLat =
(lat2-lat1)*rad;

const dLon =
(lon2-lon1)*rad;

const a =
Math.sin(dLat/2) *
Math.sin(dLat/2) +

Math.cos(lat1*rad) *
Math.cos(lat2*rad) *
Math.sin(dLon/2) *
Math.sin(dLon/2);

const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

return R*c;

}


function error(error){

document.getElementById("velocidad").innerText =
"GPS ERROR";

}

</script>

</body>
</html>
